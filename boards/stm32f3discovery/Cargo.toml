[package]
name = "stm32f3discovery"
version.workspace = true
authors.workspace = true
build = "../build.rs"
edition.workspace = true

[dependencies]
components = { path = "../components" }
cortexm4 = { path = "../../arch/cortex-m4" }
kernel = { path = "../../kernel" }
stm32f303xc = { path = "../../chips/stm32f303xc" }

capsules-core = { path = "../../capsules/core" }
capsules-extra = { path = "../../capsules/extra" }
capsules-system = { path = "../../capsules/system" }

[features]
# Run the hil::uart conformance test on USART2 at boot and print the result.
# USART1 carries the console over the ST-LINK virtual COM port; USART2 has
# its clock and NVIC enabled and is otherwise unused.
uart_contract_test = []
# Run the hil::flash conformance test at boot and print the result.
# IT ERASES AND WRITES PAGE 120, which is inside the region this board already
# gives userspace for nonvolatile storage. Off by default for that reason.
flash_contract_test = []

[build-dependencies]
tock_build_scripts = { path = "../build_scripts" }

[lints]
workspace = true
