[package]
name = "raspberry_pi_pico_2"
version.workspace = true
authors.workspace = true
build = "../build.rs"
edition.workspace = true

[dependencies]
cortexm33 = { path = "../../arch/cortex-m33" }
kernel = { path = "../../kernel" }
rp2350 = { path = "../../chips/rp2350" }
components = { path = "../components" }
enum_primitive = { path = "../../libraries/enum_primitive" }

capsules-core = { path = "../../capsules/core" }
capsules-extra = { path = "../../capsules/extra" }
capsules-system = { path = "../../capsules/system" }

[features]
# Run the hil::uart conformance test at boot and print the result.
# Off by default: it costs about 4 KB of text and prints on every boot.
uart_contract_test = []
# The same test, but looped through the pads instead of inside the
# peripheral: GP20 (UART1 TX) and GP21 (UART1 RX) are muxed to the UART and
# a jumper is expected between them. Implies the above. WITHOUT THE WIRE THE
# TEST HANGS, which is why it is not the default.
uart_contract_test_pads = ["uart_contract_test"]
uart_contract_test_unconfigured = ["uart_contract_test"]
# Run the hil::spi conformance test at boot on SPI0 (GP4 MISO, GP5 CSn,
# GP6 SCK, GP7 MOSI) and print the result. Cannot be gated: no emulated
# board in the tree exposes SPI.
spi_contract_test = []
# The same, expecting MOSI (GP7) jumpered to MISO (GP4), which adds the
# clause that the bytes read back are the bytes written. Implies the above.
# WITHOUT THE WIRE MISO FLOATS and that clause fails rather than hangs.
spi_contract_test_loopback = ["spi_contract_test"]
# Run the hil::i2c conformance test at boot on I2C0 and print the result.
# Needs NO wiring: every clause is a rejection the driver must make before
# the buffer reaches the hardware, so no device, no pull-ups, no pads muxed,
# and no collision with the other three tests over pins.
i2c_contract_test = []
# Run the hil::gpio conformance test at boot on GP20 (output) and GP21
# (input). EXPECTS THOSE TWO WIRED TOGETHER -- the same jumper the uart pads
# test uses. Without it the input floats and the round-trip clauses report
# nonsense rather than hanging. Mutually exclusive with
# uart_contract_test_pads, which muxes the same pins to UART1.
gpio_contract_test = []

# Drive the breadboard kit's 320x480 TFT on SPI0 and expose it to userspace
# through the screen syscall driver. GP2 SCLK, GP3 MOSI, GP5 CS, GP6 DC,
# GP7 RST. Off by default: a bare Pico 2 has nothing on those pins. MUTUALLY
# EXCLUSIVE with spi_contract_test, which puts SPI0 on GP4-GP7.
kit_display = []
# Fill the kit's panel from the kernel at boot and print the write rate.
# TAKES THE SCREEN CLIENT BACK from the syscall driver, so userspace sees no
# display in this build. Implies kit_display.
kit_display_test = ["kit_display"]

[build-dependencies]
tock_build_scripts = { path = "../build_scripts" }

[lints]
workspace = true
