[package]
name = "raspberry_pi_pico_2_w"
version.workspace = true
authors.workspace = true
build = "../build.rs"
edition.workspace = true

[dependencies]
cortexm33 = { path = "../../arch/cortex-m33" }
kernel = { path = "../../kernel" }
rp2350 = { path = "../../chips/rp2350" }
components = { path = "../components" }

capsules-core = { path = "../../capsules/core" }
capsules-extra = { path = "../../capsules/extra" }
capsules-system = { path = "../../capsules/system" }
raspberry_pi_pico_2 = { path = "../raspberry_pi_pico_2" }

# Exports the firmware blobs
tock-firmware-cyw43 = { git = "https://github.com/tock/firmware.git" }

[features]
# Forwarded to the shared board crate; see its Cargo.toml for the cost.
jitter_probe = ["raspberry_pi_pico_2/jitter_probe"]
uart_contract_test = ["raspberry_pi_pico_2/uart_contract_test"]
uart_contract_test_pads = ["raspberry_pi_pico_2/uart_contract_test_pads"]
uart_contract_test_unconfigured = ["raspberry_pi_pico_2/uart_contract_test_unconfigured"]
spi_contract_test = ["raspberry_pi_pico_2/spi_contract_test"]
spi_contract_test_loopback = ["raspberry_pi_pico_2/spi_contract_test_loopback"]
gpio_contract_test = ["raspberry_pi_pico_2/gpio_contract_test"]
adc_contract_test = ["raspberry_pi_pico_2/adc_contract_test"]
nvic_wake_probe = ["raspberry_pi_pico_2/nvic_wake_probe"]
trng_test = ["raspberry_pi_pico_2/trng_test"]
watchdog_probe = ["raspberry_pi_pico_2/watchdog_probe"]
wheel_source = ["raspberry_pi_pico_2/wheel_source"]
throttle_on_jumper = ["raspberry_pi_pico_2/throttle_on_jumper"]
i2c_contract_test = ["raspberry_pi_pico_2/i2c_contract_test"]
# The breadboard kit TFT on SPI0; see the shared board crate.
kit_display = ["raspberry_pi_pico_2/kit_display"]
kit_display_test = ["raspberry_pi_pico_2/kit_display_test"]
kit_input = ["raspberry_pi_pico_2/kit_input"]

[build-dependencies]
tock_build_scripts = { path = "../build_scripts" }

[lints]
workspace = true
